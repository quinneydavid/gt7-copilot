name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies (no voice model: the tests do not speak)
        run: pip install numpy pycryptodome
      - name: Compile
        run: python -m compileall -q gt7copilot earpiece phone tools && bash -n earpiece/setup-mac.sh
      - name: Tests
        run: for t in tests/test_*.py; do echo "== $t"; python "$t" || exit 1; done
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - name: Build the phone image (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: phone
          platforms: linux/amd64
          push: false
