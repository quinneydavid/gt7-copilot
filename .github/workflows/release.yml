# On a version tag (v1.2.3): test, then build and push the two images to GHCR.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: |
          pip install numpy pycryptodome
          for t in tests/test_*.py; do echo "== $t"; python "$t" || exit 1; done
      - name: Version matches the tag
        run: |
          v=$(python -c "import gt7copilot; print(gt7copilot.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::gt7copilot.__version__ ($v) != tag (${GITHUB_REF_NAME})"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Copilot image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: phonemeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-phone
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: "Phone image (amd64 only: the emulator needs x86-64)"
        uses: docker/build-push-action@v6
        with:
          context: phone
          platforms: linux/amd64
          push: true
          tags: ${{ steps.phonemeta.outputs.tags }}
          labels: ${{ steps.phonemeta.outputs.labels }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
